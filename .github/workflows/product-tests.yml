name: Frontend Product Tests CI

on:
  push:
    branches: [ "main", "feat/setup-test" ]
  pull_request:
    branches: [ "main", "feat/setup-test" ]

jobs:
  run-product-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Unit Tests (Product Validation)
        working-directory: ./frontend
        run: npm run test:unit:product

      - name: Run Unit Tests (Product Popup)
        working-directory: ./frontend
        run: npm run test:unit:prf

      - name: Run Integration Tests (Products)
        working-directory: ./frontend
        run: npm run test:inte:product

      - name: Run Mock Tests (Products)
        working-directory: ./frontend
        run: npm run test:mock:product

      - name: Generate Coverage Report
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-products
          path: frontend/coverage/

